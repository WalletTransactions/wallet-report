# Сборка Docker-образа на каждый push в main и на pull request. Юнит-тестов
# нет; сборка образа — это и есть проверка, что сервис компилируется.
#
# Выкат и интеграционные тесты — не здесь: им нужен живой стек на машине
# разработчика, это делает Jenkins (BuildPlatform). См. org/docs/TODO_ci.md.
name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  pull_request:
  workflow_dispatch:
  # release.yml вызывает отсюда юнит-тесты перед публикацией rc-образа;
  # сам образ он собирает и публикует сам, поэтому skip-image.
  workflow_call:
    inputs:
      skip-image:
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker-image:
    name: Docker image
    if: ${{ !inputs.skip-image }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      # Только проверка, что образ собирается; никуда не публикуется.
      - name: Build image
        run: |
          docker build \
              --build-arg GIT_COMMIT="$(git rev-parse --short=8 HEAD)" \
              -f Containerfile -t wallet-report:ci .

