schema: spec-driven

context: |
  Все артефакты OpenSpec пишутся на русском.
  wallet-report — read-only query-сторона (CQRS-lite) над ТОЙ ЖЕ Postgres-базой,
  что у wallet-api. Подключение только ролью wallet_reader без прав на запись и DDL.
  Изменения, требующие записи в БД, новых таблиц, SQL-функций или миграций,
  делаются в wallet-api (схема и миграции живут только там); здесь — лишь вызов.
  Внешний трафик идёт через wallet-gateway: новые пути должны оставаться под
  /api/reports/*, иначе нужна правка маршрутизации гейтвея (/admin/* уходит на google-auth).
  Аутентификация — только проверка JWT google-auth по JWKS; сервис токены не выпускает.
  openapi.yaml — источник правды по форме запросов/ответов; спеки описывают поведение
  и инварианты, а не JSON-схемы.

rules:
  specs:
    - Не дублировать JSON-схемы из openapi.yaml — ссылаться на путь/operationId
    - Каждое требование — с хотя бы одним сценарием WHEN/THEN
  design:
    - Явно указывать, нужна ли правка в wallet-api (SQL-функция, роль, миграция) или wallet-gateway
  tasks:
    - Изменение поведения отчёта сопровождается интеграционным тестом в tests_integration/
    - Изменение API сопровождается правкой openapi.yaml и таблицы эндпоинтов в README.md
